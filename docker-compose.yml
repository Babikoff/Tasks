services:
  postgres-t:
    image: postgres:17-alpine
    container_name: postgres-t
    restart: unless-stopped
    environment:
      - POSTGRES_USER=tasks
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=tasksdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasksdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-t:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - tasks-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: tasks-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HTTP_RELATIVE_PATH=/
      - KC_PROXY=edge
      - KC_HOSTNAME_STRICT=false
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/tasks-realm HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep '200 OK' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tasks-net

  rabbitmq:
    image: rabbitmq:management
    container_name: tasks-rabbitmq
    ports:
      - "5672:5672"       # RabbitMQ messaging port
      - "15672:15672"     # RabbitMQ Management Plugin port
    environment:
      - RABBITMQ_DEFAULT_USER=rabbitmq
      - RABBITMQ_DEFAULT_PASS=rabbitmq
    restart: unless-stopped
    # TODO: health check
    deploy:
      resources:
        limits:
          memory: 512M       # Limit RabbitMQ to 512 MB of RAM
    networks:
      - tasks-net

  tasksservice:
    image: ${DOCKER_REGISTRY-}tasksservice
    build:
      context: .
      dockerfile: TasksService/Dockerfile
    ports:
      - "3000:3000"
      - "8080:8080"
    environment:
      - ConnectionStrings__Tasks=Host=postgres-t;Port=5432;Database=tasksdb;Username=tasks;Password=password
      # - ASPNETCORE_ENVIRONMENT=Development
      # - ASPNETCORE_URLS=http://+:80
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=rabbitmq
      - RabbitMQ__Password=rabbitmq
      - RabbitMQ__QueueName=tasks-queue
      - Authentication__Authority=http://keycloak:8080/realms/tasks-realm
      - Authentication__Audience=tasksservice
      - Authentication__RequireHttpsMetadata=false
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - tasks-net
    depends_on:
      postgres-t:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: tasks-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - tasks-net
    depends_on:
      - tasksservice
      - keycloak

volumes:
  postgres-t:

networks:
  tasks-net:

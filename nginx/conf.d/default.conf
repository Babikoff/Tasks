# ==========================================
# Upstream configuration with Circuit Breaker
# ==========================================
upstream frontend_backend {
    server frontend:80;
    keepalive 32;
}

upstream tasksservice_backend {
    # Passive Circuit Breaker:
    # If 3 requests fail within 30s, mark server as down for 30s
    server tasksservice:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream keycloak_backend {
    server keycloak:8080;
    keepalive 32;
}

# ==========================================
# Rate Limiting configuration:  requests/sec per IP
# ==========================================
limit_req_zone $binary_remote_addr zone=ip_rate_limit:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=auth_rate_limit:10m rate=10r/s;
limit_req_status 429;

# ==========================================
# HTTP Server (Port 80) - Redirects all to HTTPS
# ==========================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Nginx self health check endpoint (bypasses redirect)
    location /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 'healthy';
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================
# HTTPS Server (Port 443) - SSL Termination & Proxy
# ==========================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # SSL / TLS Settings
    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Proxy Timeouts & Next Upstream (Circuit Breaker triggers)
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Custom JSON Error Pages
    error_page 429 = @rate_limit_handler;
    error_page 502 503 504 = @circuit_breaker_handler;

    location @rate_limit_handler {
        default_type application/json;
        return 429 '{"error": "Too Many Requests", "status": 429, "message": "Rate limit exceeded. Please slow down."}';
    }

    location @circuit_breaker_handler {
        default_type application/json;
        return 503 '{"error": "Service Unavailable", "status": 503, "message": "Backend service is currently unavailable or experiencing high load."}';
    }

    # Nginx Healthcheck endpoint
    location /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 'healthy';
    }

    # Keycloak Endpoints (/realms, /resources, /admin, /js)
    location ~ ^/(realms|resources|admin|js)/ {
        limit_req zone=auth_rate_limit burst=20 nodelay;
        proxy_pass http://keycloak_backend;
    }

    # Tasks Backend API Endpoints (/api/, /health, /swagger)
    location ~ ^/(api/|health|swagger) {
        limit_req zone=ip_rate_limit burst=20 nodelay;
        proxy_pass http://tasksservice_backend;
    }

    # Frontend Single Page Application (SPA)
    location / {
        proxy_pass http://frontend_backend;
    }
}

